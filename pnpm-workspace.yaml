packages:
  - .

onlyBuiltDependencies:
  - electron
  - esbuild
  - node-pty
  - '@vscode/ripgrep'
allowBuilds:
  electron: true
  esbuild: true
  node-pty: true
  '@vscode/ripgrep': true
  # pulled in by electron-builder for a target we do not use
  electron-winstaller: false
  # voice runs onnxruntime-web in a worker; the native one is never loaded
  onnxruntime-node: false
  protobufjs: false
minimumReleaseAge: 0
# the Claude Agent SDK's bundled copy of Claude Code (about 240 MB); Prism runs the one already installed
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
